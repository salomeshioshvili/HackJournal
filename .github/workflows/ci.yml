name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  PREFIX: sshioshvili-ieu2024
  RG: rg-sshioshvili-ieu2024
  STORAGE: sshioshvilieu2024ui
  UI_ORIGIN: https://sshioshvilieu2024ui.z28.web.core.windows.net

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install check-jsonschema==0.29.4 openapi-spec-validator==0.7.1 pyyaml==6.0.2

      - name: Validate system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml

      - name: Validate each openapi.yaml against the OpenAPI specification
        run: openapi-spec-validator services/log/openapi.yaml services/insights/openapi.yaml

      - name: Check the seam calls exist in the called service's OpenAPI document
        run: python scripts/check_system.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [log, insights]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Generate throwaway database passwords for this run
        run: |
          for name in MSSQL_SA_PASSWORD LOG_DB_PASSWORD INSIGHTS_DB_PASSWORD; do
            value="Ci1-$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start SQL Server and create the two databases
        run: |
          docker compose up -d --wait db
          docker compose run --rm db-init

      - name: Install
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check services/${{ matrix.service }}

      - name: Test with coverage (fails under 70%)
        working-directory: services/${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "log" ]; then password="$LOG_DB_PASSWORD"; else password="$INSIGHTS_DB_PASSWORD"; fi
          export DATABASE_URL="mssql+pymssql://${{ matrix.service }}_user:${password}@localhost:1433/${{ matrix.service }}_db"
          export LOG_DATABASE_URL="mssql+pymssql://log_user:${LOG_DB_PASSWORD}@localhost:1433/log_db"
          pytest --cov=rules --cov=service --cov=migrate --cov-report=term-missing --cov-fail-under=70

  images:
    needs: [describe, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [log, insights]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy log
        env:
          DB_URL: ${{ secrets.LOG_DATABASE_URL }}
        run: |
          app="$PREFIX-log"
          az containerapp secret set -n "$app" -g "$RG" --secrets "database-url=$DB_URL" -o none
          az containerapp update -n "$app" -g "$RG" \
            --image "ghcr.io/${{ github.repository_owner }}/log:${{ github.sha }}" \
            --set-env-vars DATABASE_URL=secretref:database-url PORT=8001 \
              "UI_ORIGIN=$UI_ORIGIN" "GIT_SHA=${{ github.sha }}" -o none
          az containerapp ingress update -n "$app" -g "$RG" --target-port 8001 -o none
          echo "LOG_FQDN=$(az containerapp show -n "$app" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - name: Deploy insights
        env:
          DB_URL: ${{ secrets.INSIGHTS_DATABASE_URL }}
        run: |
          app="$PREFIX-insights"
          az containerapp secret set -n "$app" -g "$RG" --secrets "database-url=$DB_URL" -o none
          az containerapp update -n "$app" -g "$RG" \
            --image "ghcr.io/${{ github.repository_owner }}/insights:${{ github.sha }}" \
            --set-env-vars DATABASE_URL=secretref:database-url PORT=8002 \
              "LOG_URL=https://$LOG_FQDN" LOG_TIMEOUT_S=2 \
              "UI_ORIGIN=$UI_ORIGIN" "GIT_SHA=${{ github.sha }}" -o none
          az containerapp ingress update -n "$app" -g "$RG" --target-port 8002 -o none
          echo "INSIGHTS_FQDN=$(az containerapp show -n "$app" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - name: Wait until both services report this commit on /health
        run: |
          for host in "$LOG_FQDN" "$INSIGHTS_FQDN"; do
            ok=""
            for attempt in $(seq 1 30); do
              body=$(curl -s --max-time 60 "https://$host/health" || true)
              echo "attempt $attempt $host: $body"
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "${{ github.sha }}"; then
                ok=yes
                break
              fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "$host did not become healthy on ${{ github.sha }}"; exit 1; }
          done

      - name: Upload the UI with the services' URLs as its config
        run: |
          printf 'window.CONFIG = {\n  LOG_URL: "https://%s",\n  INSIGHTS_URL: "https://%s",\n};\n' \
            "$LOG_FQDN" "$INSIGHTS_FQDN" > ui/config.js
          cat ui/config.js
          az storage blob upload-batch --account-name "$STORAGE" --auth-mode key \
            -d '$web' -s ui --overwrite --content-cache-control "no-cache" -o none
          curl -fsS --max-time 30 "$UI_ORIGIN/config.js"
